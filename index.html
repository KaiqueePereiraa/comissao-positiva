<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bônus Positiva</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#212B37;--navy:#34425C;--green:#BEF575;--gray:#BBC0C9;
  --mid:#788192;--white:#fff;--bg:#EEF1F4;--card:#fff;
  --danger:#E74C3C;--warning:#F39C12;--success:#27AE60;
  --green-deep:#7FB85A;
  --grad-brand:linear-gradient(100deg,#34425C 0%,#7FB85A 55%,#BEF575 100%);
  --grad-dark:linear-gradient(135deg,#212B37 0%,#34425C 100%);
  --radius:14px;--shadow:0 1px 3px rgba(33,43,55,.06),0 6px 20px rgba(33,43,55,.08);
}
body{font-family:'Avenir Next','Avenir','Montserrat',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;-webkit-font-smoothing:antialiased}
.logo-img{display:block;object-fit:contain;object-position:left center}

/* ── LOGIN ── */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--grad-dark);position:relative;overflow:hidden;padding:24px;
}
/* acento diagonal verde — assinatura da marca Positiva */
#login-screen::before{
  content:"";position:absolute;top:50%;left:-10%;width:120%;height:140px;
  background:var(--grad-brand);opacity:.22;
  transform:translateY(-50%) rotate(-9deg);filter:blur(2px);
}
#login-screen::after{
  content:"";position:absolute;top:0;right:0;width:42%;height:100%;
  background:radial-gradient(circle at 80% 20%,rgba(190,245,117,.10),transparent 60%);
}
.login-box{
  position:relative;z-index:2;
  background:var(--white);border-radius:24px;padding:52px 44px;
  width:100%;max-width:430px;
  box-shadow:0 30px 80px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.04);
}
.login-logo{text-align:center;margin-bottom:36px}
.login-logo .logo-mark{
  height:90px;margin:0 auto 20px;display:flex;
  justify-content:center;align-items:center;
}
.login-logo .logo-mark .logo-img{height:90px;width:auto}
.login-logo h1{
  font-size:24px;font-weight:900;color:var(--dark);
  font-style:italic;letter-spacing:1px;text-transform:uppercase;
}
.login-logo p{
  color:var(--mid);font-size:11px;margin-top:6px;
  text-transform:uppercase;letter-spacing:3px;font-weight:700;
}
.login-logo .divider-line{
  width:48px;height:4px;background:var(--grad-brand);
  border-radius:4px;margin:18px auto 0;
}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-weight:700;font-size:13px;color:var(--navy);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input{
  width:100%;padding:12px 16px;border:2px solid var(--gray);border-radius:10px;
  font-family:inherit;font-size:15px;color:var(--dark);
  transition:border-color .2s;outline:none;
}
.form-group input:focus{border-color:var(--navy)}
.btn-login{
  width:100%;padding:15px;background:var(--dark);color:var(--white);
  border:none;border-radius:12px;font-family:inherit;font-size:15px;
  font-weight:800;cursor:pointer;transition:.2s;margin-top:10px;
  text-transform:uppercase;letter-spacing:1px;position:relative;overflow:hidden;
}
.btn-login::after{
  content:"";position:absolute;left:0;bottom:0;width:100%;height:4px;
  background:var(--grad-brand);transform:scaleX(0);transform-origin:left;
  transition:transform .3s;
}
.btn-login:hover{background:var(--navy);transform:translateY(-1px)}
.btn-login:hover::after{transform:scaleX(1)}
.login-error{
  color:var(--danger);font-size:13px;text-align:center;
  margin-top:12px;display:none;
}

/* ── APP ── */
#app{display:none}
.header{
  background:var(--dark);padding:0 32px;height:66px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 16px rgba(33,43,55,.25);
}
.header::after{
  content:"";position:absolute;left:0;bottom:0;width:100%;height:3px;
  background:var(--grad-brand);
}
.header-logo{display:flex;align-items:center;gap:14px}
.header-logo .mark{
  height:42px;display:flex;align-items:center;
}
.header-logo .mark .logo-img{height:42px;width:auto}
.header-logo .wordmark{
  color:var(--white);font-weight:900;font-size:17px;
  font-style:italic;letter-spacing:1px;
}
.header-logo .month{
  color:var(--dark);font-size:12px;margin-left:6px;font-weight:800;
  background:var(--green);padding:4px 12px;border-radius:20px;
}
.header-right{display:flex;align-items:center;gap:16px}
.user-badge{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.1);padding:6px 14px;border-radius:20px;
}
.user-badge .avatar{
  width:28px;height:28px;background:var(--green);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;color:var(--dark);
}
.user-badge .uname{color:var(--white);font-size:13px;font-weight:700}
.user-badge .urole{color:var(--gray);font-size:11px}
.btn-logout{
  background:transparent;border:1.5px solid rgba(255,255,255,.3);
  color:var(--white);padding:6px 14px;border-radius:8px;
  font-family:inherit;font-size:13px;cursor:pointer;transition:.2s;
}
.btn-logout:hover{background:rgba(255,255,255,.1)}

/* ── TABS ── */
.tabs-bar{
  background:var(--white);border-bottom:1px solid #e8eaed;
  padding:0 32px;display:flex;gap:4px;
}
.tab-btn{
  padding:16px 20px;border:none;background:transparent;
  font-family:inherit;font-size:14px;font-weight:700;color:var(--mid);
  cursor:pointer;border-bottom:3px solid transparent;transition:.2s;
  white-space:nowrap;
}
.tab-btn:hover{color:var(--navy)}
.tab-btn.active{color:var(--dark);border-bottom-color:var(--green)}
.tab-btn .badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;background:var(--green);color:var(--dark);
  border-radius:50%;font-size:10px;font-weight:900;margin-left:6px;
}

/* ── CONTENT ── */
.content{padding:28px 32px;max-width:1400px;margin:0 auto}

/* ── KPI CARDS ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.kpi-card{
  background:var(--white);border-radius:var(--radius);padding:24px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
}
.kpi-card::before{
  content:"";position:absolute;left:0;top:0;width:4px;height:100%;
  background:var(--grad-brand);
}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(33,43,55,.14)}
.kpi-card.highlight{background:var(--grad-dark)}
.kpi-card.highlight::before{background:var(--grad-brand)}
.kpi-card.highlight .kpi-label{color:var(--gray)}
.kpi-card.highlight .kpi-value{color:var(--green)}
.kpi-card.highlight .kpi-sub{color:var(--gray)}
.kpi-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mid);margin-bottom:8px}
.kpi-value{font-size:32px;font-weight:900;color:var(--dark);letter-spacing:-.5px}
.kpi-sub{font-size:13px;color:var(--mid);margin-top:4px;font-weight:600}

/* ── CHARTS GRID ── */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
@media(max-width:900px){.charts-grid{grid-template-columns:1fr}}
.chart-card{background:var(--white);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.chart-card h3{font-size:15px;font-weight:800;color:var(--dark);margin-bottom:16px;padding-left:12px;border-left:3px solid;border-image:var(--grad-brand) 1}
.chart-card canvas{max-height:260px}

/* ── TABLE ── */
.table-card{background:var(--white);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:28px}
.table-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.table-header h3{font-size:15px;font-weight:800;color:var(--dark)}
.search-box{
  padding:8px 14px;border:1.5px solid var(--gray);border-radius:8px;
  font-family:inherit;font-size:13px;outline:none;width:220px;
}
.search-box:focus{border-color:var(--navy)}
.data-table{width:100%;border-collapse:collapse}
.data-table th{
  text-align:left;padding:10px 12px;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;color:var(--mid);
  border-bottom:2px solid #e8eaed;
}
.data-table td{
  padding:12px 12px;font-size:14px;border-bottom:1px solid #f0f2f5;
  vertical-align:middle;
}
.data-table tr:hover td{background:#f8f9fa}
.data-table tr.mine td{background:#f0fff4}
.data-table tr.mine td{border-left:3px solid var(--green)}
.tag{
  display:inline-flex;align-items:center;padding:3px 10px;
  border-radius:20px;font-size:12px;font-weight:700;
}
.tag-new{background:#e8f5e9;color:#2e7d32}
.tag-renewal{background:#e3f2fd;color:#1565c0}
.tag-disputed{background:#fff3e0;color:#e65100}
.tag-resolved{background:#f3e5f5;color:#6a1b9a}
.tag-coord{background:#fce4ec;color:#880e4f;font-size:11px}
.btn-dispute{
  padding:4px 10px;background:transparent;border:1.5px solid var(--gray);
  border-radius:6px;font-family:inherit;font-size:12px;font-weight:700;
  color:var(--mid);cursor:pointer;transition:.2s;
}
.btn-dispute:hover{border-color:var(--warning);color:var(--warning)}
.btn-sm{
  padding:4px 10px;border:none;border-radius:6px;
  font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;
}
.btn-approve{background:#e8f5e9;color:#2e7d32}
.btn-transfer{background:#fff3e0;color:#e65100}
.btn-reject{background:#ffebee;color:#c62828}

/* ── RANKING TABLE ── */
.ranking-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f2f5}
.rank-pos{font-size:18px;font-weight:900;color:var(--gray);width:28px;text-align:center}
.rank-pos.top{color:var(--green)}
.rank-name{flex:1;font-weight:700;font-size:15px}
.rank-bar-wrap{width:160px;height:8px;background:#f0f2f5;border-radius:4px;overflow:hidden}
.rank-bar{height:100%;background:var(--grad-brand);border-radius:4px;transition:width .6s}
.rank-val{font-size:15px;font-weight:900;color:var(--dark);min-width:80px;text-align:right}
.rank-detail{font-size:12px;color:var(--mid)}

/* ── DISPUTES ── */
.dispute-card{
  background:var(--white);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);margin-bottom:12px;
  border-left:4px solid var(--warning);
}
.dispute-card.resolved{border-left-color:var(--success)}
.dispute-meta{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.dispute-reason{font-size:14px;color:var(--dark);margin:8px 0}
.dispute-decision{
  background:#f8f9fa;border-radius:8px;padding:10px 14px;
  font-size:13px;color:var(--mid);margin-top:8px;
}
.dispute-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* ── ADMIN PANEL ── */
.admin-section{background:var(--white);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:24px}
.admin-section h3{font-size:16px;font-weight:800;color:var(--dark);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #f0f2f5}
.user-list{display:grid;gap:10px}
.user-row{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:#f8f9fa;border-radius:10px;
}
.user-avatar{
  width:40px;height:40px;background:var(--navy);border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;color:var(--white);font-size:14px;
}
.user-info{flex:1}
.user-info .un{font-weight:700;font-size:14px}
.user-info .up{font-size:12px;color:var(--mid)}
.btn-del{
  padding:6px 12px;background:#ffebee;color:#c62828;border:none;
  border-radius:6px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;
}
.btn-edit-pw{
  padding:6px 12px;background:#e3f2fd;color:#1565c0;border:none;
  border-radius:6px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;margin-right:6px;
}
.add-user-form{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.add-user-form input{
  flex:1;min-width:140px;padding:10px 14px;border:1.5px solid var(--gray);
  border-radius:8px;font-family:inherit;font-size:14px;outline:none;
}
.add-user-form input:focus{border-color:var(--navy)}
.btn-add{
  padding:10px 20px;background:var(--dark);color:var(--white);border:none;
  border-radius:8px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;
}

/* ── MODAL ── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:1000;align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--white);border-radius:16px;padding:32px;
  width:100%;max-width:500px;max-height:90vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal h3{font-size:18px;font-weight:800;margin-bottom:20px;color:var(--dark)}
.modal textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--gray);border-radius:8px;
  font-family:inherit;font-size:14px;resize:vertical;min-height:100px;outline:none;
}
.modal textarea:focus{border-color:var(--navy)}
.modal-info{
  background:#f8f9fa;border-radius:8px;padding:12px 14px;
  font-size:13px;color:var(--mid);margin-bottom:16px;
}
.modal-info strong{color:var(--dark)}
.modal-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.btn-cancel{
  padding:10px 20px;background:#f0f2f5;color:var(--mid);border:none;
  border-radius:8px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;
}
.btn-primary{
  padding:10px 20px;background:var(--dark);color:var(--white);border:none;
  border-radius:8px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;
}

/* ── SECTION NAV ── */
.section-nav{
  display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;
}
.sec-btn{
  padding:8px 18px;border:1.5px solid var(--gray);border-radius:20px;
  background:transparent;font-family:inherit;font-size:13px;font-weight:700;
  color:var(--mid);cursor:pointer;transition:.2s;
}
.sec-btn:hover{border-color:var(--navy);color:var(--navy)}
.sec-btn.active{background:var(--dark);color:var(--white);border-color:var(--dark)}

/* ── MY HIGHLIGHT ── */
.my-highlight-bar{
  background:var(--grad-dark);position:relative;overflow:hidden;
  border-radius:var(--radius);padding:26px 28px;margin-bottom:24px;
  display:flex;align-items:center;gap:24px;flex-wrap:wrap;
}
.my-highlight-bar::after{
  content:"";position:absolute;right:-5%;top:50%;width:55%;height:90px;
  background:var(--grad-brand);opacity:.16;
  transform:translateY(-50%) rotate(-9deg);
}
.my-highlight-bar>*{position:relative;z-index:1}
.my-highlight-bar .mh-item{text-align:center}
.my-highlight-bar .mh-val{font-size:28px;font-weight:900;color:var(--green)}
.my-highlight-bar .mh-lbl{font-size:12px;color:var(--gray);font-weight:700;text-transform:uppercase}
.my-highlight-bar .divider{width:1px;height:48px;background:rgba(255,255,255,.15)}
.my-highlight-bar .mh-name{font-size:18px;font-weight:900;color:var(--white);flex:1}

/* ── EMPTY STATE ── */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--mid);
}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:15px}

/* ── MISC ── */
.section-panel{display:none}
.section-panel.active{display:block}
.page-title{font-size:23px;font-weight:900;color:var(--dark);margin-bottom:4px;letter-spacing:-.3px}
.page-title::after{content:"";display:block;width:42px;height:4px;background:var(--grad-brand);border-radius:4px;margin-top:10px}
.page-sub{font-size:14px;color:var(--mid);margin-bottom:24px}
select{
  padding:8px 14px;border:1.5px solid var(--gray);border-radius:8px;
  font-family:inherit;font-size:13px;color:var(--dark);background:var(--white);
  outline:none;cursor:pointer;
}
select:focus{border-color:var(--navy)}
.flex-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.coordinator-notice{
  background:#f0fff4;border:1.5px solid #c8e6c9;border-radius:10px;
  padding:10px 16px;font-size:13px;color:#2e7d32;margin-bottom:20px;
  font-weight:600;
}
</style>
</head>
<body>

<!-- ══════════════════ LOGIN ══════════════════ -->
<div id="login-screen">

      </div>

const USERS_KEY    = 'positiva_users';
const USERS_VER    = 'positiva_users_ver';
const USERS_VER_ID = 'v2'; // incrementar aqui força regeneração dos logins
const SESSION_KEY  = 'positiva_session';
const DISPUTES_KEY  = 'positiva_disputes_'  + MONTH.replace('/','_');
const OVERRIDES_KEY = 'positiva_overrides_' + MONTH.replace('/','_');

function loadUsers() {
  const savedVer = localStorage.getItem(USERS_VER);
  const saved    = localStorage.getItem(USERS_KEY);

  // Se versão bate e já tem usuários salvos, usa o salvo
  if (saved && savedVer === USERS_VER_ID) {
    const parsed = JSON.parse(saved);
    // Garante que o coordenador sempre existe
    if (!parsed.coordenador) parsed.coordenador = { name:'Coordenador', role:'coordinator', pw:'positiva2026' };
    return parsed;
  }

  // Versão nova ou sem dados: regenera logins a partir dos dados brutos
  const consultants = [...new Set(RAW_SALES.map(s => s.consultant))].filter(Boolean);
  const users = {};

  // Preserva senhas customizadas se existirem
  const oldUsers = saved ? JSON.parse(saved) : {};

  // Coordenador
  users['coordenador'] = oldUsers['coordenador'] || { name:'Coordenador', role:'coordinator', pw:'positiva2026' };

  consultants.forEach(name => {
    const parts = name.trim().split(/\s+/);
    const login = (parts[0] + (parts.length > 1 ? parts[parts.length - 1] : ''))
      .toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    // Busca senha antiga pelo nome completo para não perder
    const oldEntry = Object.values(oldUsers).find(u => u.name === name);
    users[login] = { name, role:'consultant', pw: oldEntry ? oldEntry.pw : 'positiva123' };
  });

  saveUsers(users);
  localStorage.setItem(USERS_VER, USERS_VER_ID);
  return users;
}

function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }

function loadDisputes() {
  const saved = localStorage.getItem(DISPUTES_KEY);
  return saved ? JSON.parse(saved) : [];
}
function saveDisputes(d) { localStorage.setItem(DISPUTES_KEY, JSON.stringify(d)); }

function loadOverrides() {
  const saved = localStorage.getItem(OVERRIDES_KEY);
  return saved ? JSON.parse(saved) : { unassigned: [], added: [] };
}
function saveOverrides(o) { localStorage.setItem(OVERRIDES_KEY, JSON.stringify(o)); }

// Retorna "PrimeiroNome Sobrenome" para diferenciar homônimos
function shortName(fullName) {
  if (!fullName) return '—';
  const parts = fullName.trim().split(/\s+/);
  if (parts.length <= 2) return parts.map(p => p[0] + p.slice(1).toLowerCase()).join(' ');
  const first = parts[0][0] + parts[0].slice(1).toLowerCase();
  const last  = parts[parts.length - 1][0] + parts[parts.length - 1].slice(1).toLowerCase();
  return first + ' ' + last;
}

function doLogin() {
  users = loadUsers();
  const login = document.getElementById('inp-user').value.trim().toLowerCase();
  const pass  = document.getElementById('inp-pass').value;
  const user  = users[login];
  if (!user || user.pw !== pass) {
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  session = { login, ...user };
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  bootApp();
}

function doLogout() {
  localStorage.removeItem(SESSION_KEY);
  session = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('inp-pass').value = '';
}

document.getElementById('inp-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function bootApp() {
  users    = loadUsers();
  disputes = loadDisputes();
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('hdr-month').textContent = MONTH;
  document.getElementById('hdr-name').textContent  = session.name;
  document.getElementById('hdr-role').textContent  = session.role === 'coordinator' ? 'Coordenador' : 'Consultor';

  buildTabs();
  buildSectionNav();
  renderSection(activeSection);
}

    UNIT_KEYS.forEach((uk) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn';
      btn.textContent = UNIT_LABELS[uk] || uk;
      btn.onclick = () => switchUnit(uk, btn);
      bar.appendChild(btn);
    });
    activeUnit = null; // começa com todas as unidades
  } else {
    const btn = document.createElement('button');
    btn.className = 'tab-btn active';
    btn.textContent = 'Meu Dashboard';
    bar.appendChild(btn);
    activeUnit = null;
  }

  // Seletor de mês (aparece apenas se há mais de 1 mês)
  if (ALL_MONTHS.length > 1) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 8px';
    wrap.innerHTML = `
      <span style="font-size:12px;font-weight:700;color:var(--mid);text-transform:uppercase;letter-spacing:.5px">Mês:</span>
      <select id="month-select" style="padding:6px 12px;border:1.5px solid var(--gray);border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;color:var(--dark);background:var(--white);outline:none;cursor:pointer">
        ${ALL_MONTHS.map(m=>`<option value="${m}" ${m===activeMonth?'selected':''}>${m}</option>`).join('')}
      </select>`;
    wrap.querySelector('#month-select').onchange = function() {
      activeMonth = this.value;
      destroyCharts();
      renderSection(activeSection);
    };
    bar.appendChild(wrap);
  }
}

  });

function sectionLabel(id) {
  return {overview:'Visão',sales:'Vendas',ranking:'Ranking',disputes:'Disputas',compare:'Comparar',admin:'Gerenciar'}[id]||id;
}

function switchSection(id) {
  activeSection = id;
  const lbl = sectionLabel(id);
  document.querySelectorAll('.sec-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.startsWith(lbl));
  });
  destroyCharts();
  renderSection(id);
}

// ══════════════════════════════════════════════
//  FILTER SALES
// ══════════════════════════════════════════════
function getFilteredSales(monthOverride, opts) {
  let sales = RAW_SALES.map(s => ({...s}));
  const overrides = loadOverrides();
  // Apply dispute transfers
  disputes.filter(d => d.status === 'resolved' && d.action === 'transfer').forEach(d => {
    const s = sales.find(x => x.id === d.saleId && x.unit === d.unit);
    if (s) s.consultant = d.claimant;
  });
  // Apply unassignments
  overrides.unassigned.forEach(({id, unit}) => {
    const s = sales.find(x => x.id === id && x.unit === unit);
    if (s) s.consultant = '';
  });
  // Include manually added sales
  sales = [...sales, ...overrides.added];

  const month = monthOverride || activeMonth;
  sales = sales.filter(s => s.month === month);
  if (activeUnit) sales = sales.filter(s => s.unit === activeUnit);
  // Vendas sem dono são excluídas de todos os cálculos e visões (exceto tabela do coordenador)
  if (!(opts && opts.includeUnassigned)) {
    sales = sales.filter(s => !!s.consultant);
  }
  return sales;
}

function salesForConsultant(name, sales) {
  return sales.filter(s => s.consultant === name);
}

function getConsultants(sales) {
  return [...new Set(sales.map(s => s.consultant))].filter(Boolean).sort();
}

function calcCommission(sales) {
  return sales.reduce((a, s) => a + s.commission, 0);
}

// ══════════════════════════════════════════════
//  RENDER SECTION
// ══════════════════════════════════════════════
function renderSection(id) {
  ['overview','sales','ranking','disputes','compare','admin'].forEach(p => {
    document.getElementById('panel-'+p).classList.toggle('active', p===id);
  });

  const sales = getFilteredSales();
  if (id === 'overview')  renderOverview(sales);
  if (id === 'sales')     renderSales(sales);
  if (id === 'ranking')   renderRanking(sales);
  if (id === 'disputes')  renderDisputes(sales);
  if (id === 'compare')   renderCompare();
  if (id === 'admin')     renderAdmin();
}

}

function applyFilters() {
  const search = (document.getElementById('search-sales')?.value || '').toLowerCase();
  const type   = document.getElementById('type-filter')?.value || '';
  const cons   = document.getElementById('consultant-filter')?.value || '';
  const unit   = document.getElementById('unit-filter')?.value || '';
  const isCoord = session.role === 'coordinator';
  let sales = getFilteredSales(null, isCoord ? {includeUnassigned:true} : null);
  if (type)   sales = sales.filter(s=>s.type===type);
  if (cons)   sales = sales.filter(s=>s.consultant===cons);
  if (unit)   sales = sales.filter(s=>s.unit===unit);
  if (search) sales = sales.filter(s=>
    s.student.toLowerCase().includes(search) ||
    s.id.toLowerCase().includes(search) ||
    (s.consultant||'').toLowerCase().includes(search)
  );
  renderSalesTable(sales);
}

function renderSalesTable(sales) {
  const body = document.getElementById('sales-table-body');
  if (!body) return;
  if (!sales.length) {
    body.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>Nenhuma venda encontrada.</p></div>';
    return;
  }

  const isCoord = session.role === 'coordinator';
  const overrides = loadOverrides();

  body.innerHTML = `<table class="data-table">
    <thead><tr>
      <th>ID</th><th>Aluno</th><th>Consultor</th><th>Tipo</th>
      <th>Bônus</th><th>Data</th><th>Contrato</th>
      <th>Ação</th>
    </tr></thead>
    <tbody>
    ${sales.map(s => {
      const dispute = disputes.find(d=>d.saleId===s.id && d.unit===s.unit && d.status==='open');
      const resolved= disputes.find(d=>d.saleId===s.id && d.unit===s.unit && d.status==='resolved');
      const isDisp  = !!dispute;
      const isRes   = !!resolved;
      const isMe    = s.consultant === session.name;
      const isUnassigned = !s.consultant;
      const isManual = !!s._manual;
      const isAlreadyUnassigned = overrides.unassigned.some(u => u.id === s.id && u.unit === s.unit);

      let consultantCell = isUnassigned
        ? '<span class="tag" style="background:#f5f5f5;color:#999;font-size:11px">Sem consultor</span>'
        : `${shortName(s.consultant)} ${isMe?'<span class="tag" style="background:#e8f5e9;color:#2e7d32;font-size:10px">Você</span>':''}`;

      let actionCell = '<td></td>';

      if (isCoord) {
        if (isManual) {
          actionCell = `<td><span class="tag" style="background:#e3f2fd;color:#1565c0;font-size:11px;margin-right:6px">Manual</span><button class="btn-del" onclick="deleteAddedSale('${s.id}')" style="font-size:11px;padding:3px 8px">Excluir</button></td>`;
        } else if (isUnassigned || isAlreadyUnassigned) {
          actionCell = `<td><button class="btn-sm btn-approve" onclick="reassignSale('${s.id}','${s.unit}')" style="font-size:11px">Reatribuir</button></td>`;
        } else {
          actionCell = `<td><button class="btn-sm btn-reject" onclick="unassignSale('${s.id}','${s.unit}')" style="font-size:11px">Remover Dono</button></td>`;
        }
      } else {
        if (!isMe && !isDisp && !isRes && !isUnassigned) {
          actionCell = `<td><button class="btn-dispute" onclick="openDisputeModal('${s.id}','${s.unit}')">Contestar</button></td>`;
        } else if (isDisp && dispute.claimant === session.name) {
          actionCell = `<td><span style="font-size:12px;color:var(--warning);font-weight:700">Aguardando</span></td>`;
        }
      }

      return `<tr class="${isMe?'mine':''}${isUnassigned?' style="opacity:.6"':''}">
        <td><strong>#${s.id}</strong></td>
        <td>${s.student}</td>
        <td>${consultantCell}</td>
        <td><span class="tag ${s.type==='new'?'tag-new':'tag-renewal'}">${s.type==='new'?'Novo':'Rematrícula'}</span></td>
        <td><strong>R$ ${s.commission}</strong></td>
        <td>${s.date}</td>
        <td style="max-width:200px;font-size:12px;color:var(--mid)">${s.contract.slice(0,40)}${s.contract.length>40?'…':''}</td>
        ${actionCell}
      </tr>`;
    }).join('')}
    </tbody>
  </table>`;
}

  const resolved = relevantDisputes.filter(d=>d.status==='resolved');

  let html = `
    <p class="page-title">Disputas</p>

function renderCompare() {
  const el = document.getElementById('panel-compare');
  if (ALL_MONTHS.length < 2) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📅</div><p>Adicione dados de pelo menos 2 meses para comparar.</p></div>';
    return;
  }

  const defaultA = ALL_MONTHS[ALL_MONTHS.length - 2];
  const defaultB = ALL_MONTHS[ALL_MONTHS.length - 1];

  el.innerHTML = `
    <p class="page-title">Comparar Meses</p>
    <p class="page-sub">Selecione dois meses para comparar lado a lado</p>
    <div class="flex-row" style="margin-bottom:24px;gap:16px;flex-wrap:wrap;align-items:center">
      <select id="cmp-month-a" onchange="updateCompare()" style="font-size:15px;font-weight:800;padding:10px 16px;border:2px solid var(--navy);border-radius:10px">
        ${ALL_MONTHS.map(m=>`<option value="${m}" ${m===defaultA?'selected':''}>${m}</option>`).join('')}
      </select>
      <span style="font-size:20px;color:var(--mid);font-weight:900">vs</span>
      <select id="cmp-month-b" onchange="updateCompare()" style="font-size:15px;font-weight:800;padding:10px 16px;border:2px solid var(--green);border-radius:10px">
        ${ALL_MONTHS.map(m=>`<option value="${m}" ${m===defaultB?'selected':''}>${m}</option>`).join('')}
      </select>
    </div>
    <div id="compare-body"></div>
  `;
  updateCompare();
}

function updateCompare() {
  const mA = document.getElementById('cmp-month-a')?.value;
  const mB = document.getElementById('cmp-month-b')?.value;
  if (!mA || !mB) return;

  if (chartCmp1) { chartCmp1.destroy(); chartCmp1 = null; }
  if (chartCmp2) { chartCmp2.destroy(); chartCmp2 = null; }

  const salesA = getFilteredSales(mA);
  const salesB = getFilteredSales(mB);

  function stats(sales) {
    const consultants = getConsultants(sales);
    return {
      total: sales.length,
      newCount: sales.filter(s=>s.type==='new').length,
      renCount: sales.filter(s=>s.type==='renewal').length,
      commission: calcCommission(sales),
      consultants: consultants.length,
      ranked: consultants.map(c => {
        const cs = salesForConsultant(c, sales);
        return {name:shortName(c), comm:calcCommission(cs), new:cs.filter(s=>s.type==='new').length, ren:cs.filter(s=>s.type==='renewal').length};
      }).sort((a,b)=>b.comm-a.comm),
    };
  }

  const stA = stats(salesA);
  const stB = stats(salesB);

  function delta(a, b) {
    const d = b - a;
    if (d === 0) return '<span style="color:var(--mid)">—</span>';
    const sign = d > 0 ? '+' : '';
    const color = d > 0 ? 'var(--success)' : 'var(--danger)';
    return `<span style="color:${color};font-weight:900">${sign}${d}</span>`;
  }
  function deltaR(a, b) {
    if (!a) return '';
    const d = ((b-a)/a*100).toFixed(1);
    const sign = d > 0 ? '+' : '';
    const color = d > 0 ? 'var(--success)' : 'var(--danger)';
    return `<span style="font-size:11px;color:${color}">${sign}${d}%</span>`;
  }

  // All consultants union
  const allConsultants = [...new Set([...stA.ranked.map(r=>r.name), ...stB.ranked.map(r=>r.name)])];

  const body = document.getElementById('compare-body');
  body.innerHTML = `
    <!-- KPI comparison -->
    <div class="table-card" style="margin-bottom:20px">
      <table class="data-table">
        <thead><tr>
          <th>Métrica</th>
          <th style="color:var(--navy)">${mA}</th>
          <th style="color:var(--dark)">${mB}</th>
          <th>Variação</th>
        </tr></thead>
        <tbody>
          <tr><td><strong>Total Vendas</strong></td><td>${stA.total}</td><td>${stB.total}</td><td>${delta(stA.total,stB.total)} ${deltaR(stA.total,stB.total)}</td></tr>
          <tr><td>Alunos Novos</td><td>${stA.newCount}</td><td>${stB.newCount}</td><td>${delta(stA.newCount,stB.newCount)} ${deltaR(stA.newCount,stB.newCount)}</td></tr>
          <tr><td>Rematrículas</td><td>${stA.renCount}</td><td>${stB.renCount}</td><td>${delta(stA.renCount,stB.renCount)} ${deltaR(stA.renCount,stB.renCount)}</td></tr>
          <tr><td><strong>Total Bônus</strong></td><td><strong>R$ ${stA.commission}</strong></td><td><strong>R$ ${stB.commission}</strong></td><td>${delta(stA.commission,stB.commission)} ${deltaR(stA.commission,stB.commission)}</td></tr>
          <tr><td>Consultores Ativos</td><td>${stA.consultants}</td><td>${stB.consultants}</td><td>${delta(stA.consultants,stB.consultants)}</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Charts -->
    <div class="charts-grid" style="margin-bottom:20px">
      <div class="chart-card">
        <h3>Bônus por Consultor — ${mA} vs ${mB}</h3>
        <canvas id="chart-cmp1"></canvas>
      </div>
      <div class="chart-card">
        <h3>Novos vs Rematrícula — ${mA} vs ${mB}</h3>
        <canvas id="chart-cmp2"></canvas>
      </div>
    </div>

    <!-- Consultant detail table -->
    <div class="table-card">
      <h3 style="margin-bottom:16px">Desempenho por Consultor</h3>
      <table class="data-table">
        <thead><tr>
          <th>Consultor</th>
          <th style="color:var(--navy)">Bônus ${mA}</th>
          <th style="color:var(--dark)">Bônus ${mB}</th>
          <th>Variação</th>
          <th style="color:var(--navy)">Vendas ${mA}</th>
          <th style="color:var(--dark)">Vendas ${mB}</th>
        </tr></thead>
        <tbody>
          ${allConsultants.map(name => {
            const a = stA.ranked.find(r=>r.name===name) || {comm:0,new:0,ren:0};
            const b = stB.ranked.find(r=>r.name===name) || {comm:0,new:0,ren:0};
            const isMe = session.name.startsWith(name.split(' ')[0]);
            return `<tr class="${isMe?'mine':''}">
              <td><strong>${name}</strong></td>
              <td>R$ ${a.comm}</td>
              <td>R$ ${b.comm}</td>
              <td>${delta(a.comm,b.comm)} ${deltaR(a.comm,b.comm)}</td>
              <td>${a.new+a.ren}</td>
              <td>${b.new+b.ren}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;

  // Chart 1: bônus lado a lado por consultor
  const ctx1 = document.getElementById('chart-cmp1').getContext('2d');
  chartCmp1 = new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: allConsultants.map(n=>n),
      datasets: [
        {label:mA, data:allConsultants.map(n=>{const r=stA.ranked.find(x=>x.name===n);return r?r.comm:0}), backgroundColor:'#34425C', borderRadius:4},
        {label:mB, data:allConsultants.map(n=>{const r=stB.ranked.find(x=>x.name===n);return r?r.comm:0}), backgroundColor:'#BEF575', borderRadius:4},
      ]
    },
    options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true}}}
  });

  // Chart 2: novos + rematrícula total por mês
  const ctx2 = document.getElementById('chart-cmp2').getContext('2d');
  chartCmp2 = new Chart(ctx2, {
    type:'bar',
    data:{
      labels:[mA, mB],
      datasets:[
        {label:'Novos',      data:[stA.newCount,stB.newCount], backgroundColor:'#34425C', borderRadius:4},
        {label:'Rematrícula',data:[stA.renCount,stB.renCount], backgroundColor:'#BEF575', borderRadius:4},
      ]
    },
    options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true}}}
  });
}

// ══════════════════════════════════════════════
//  ADMIN
// ══════════════════════════════════════════════
function renderAdmin() {
  const el = document.getElementById('panel-admin');
  const userList = Object.entries(users).filter(([k])=>k!=='coordenador');

  el.innerHTML = `
    <p class="page-title">Gerenciar Usuários</p>
    <p class="page-sub">Adicione, remova ou altere senhas dos consultores</p>

    <div class="admin-section">
      <h3>Consultores Cadastrados (${userList.length})</h3>
      <div class="user-list" id="user-list">
        ${userList.map(([login, u]) => `
          <div class="user-row">
            <div class="user-avatar">${u.name[0]}</div>
            <div class="user-info">
              <div class="un">${shortName(u.name)}</div>
              <div class="up">Login: <strong>${login}</strong> · Senha: <strong>${u.pw}</strong></div>
            </div>
            <button class="btn-edit-pw" onclick="openPwModal('${login}')">Alterar Senha</button>
            <button class="btn-del" onclick="deleteUser('${login}')">Remover</button>
          </div>
        `).join('')}
      </div>

      <div class="add-user-form" style="margin-top:20px">
        <input id="new-user-name"  placeholder="Nome completo do consultor">
        <input id="new-user-login" placeholder="Login (ex: maria)">
        <input id="new-user-pw"    placeholder="Senha inicial">
        <button class="btn-add" onclick="addUser()">+ Adicionar</button>
      </div>
    </div>
  `;
}

function addUser() {
  const name  = document.getElementById('new-user-name').value.trim().toUpperCase();
  const login = document.getElementById('new-user-login').value.trim().toLowerCase();
  const pw    = document.getElementById('new-user-pw').value.trim();
  if (!name||!login||!pw) { alert('Preencha todos os campos.'); return; }
  if (users[login]) { alert('Login já existe.'); return; }
  users[login] = {name, role:'consultant', pw};
  saveUsers(users);
  renderAdmin();
}

function deleteUser(login) {
  if (!confirm('Remover acesso de '+users[login].name+'?')) return;
  delete users[login];
  saveUsers(users);
  renderAdmin();
}

function openPwModal(login) {
  pendingPwLogin = login;
  document.getElementById('new-pw').value = '';
  openModal('modal-pw');
}

function saveNewPw() {
  const pw = document.getElementById('new-pw').value.trim();
  if (!pw) return;
  users[pendingPwLogin].pw = pw;
  saveUsers(users);
  closeModal('modal-pw');
  renderAdmin();
}

// ══════════════════════════════════════════════
//  GERENCIAR VENDAS (COORD)
// ══════════════════════════════════════════════
function unassignSale(id, unit) {
  if (!confirm('Remover o dono desta venda? Ela ficará sem consultor atribuído.')) return;
  const overrides = loadOverrides();
  if (!overrides.unassigned.some(u => u.id === id && u.unit === unit)) {
    overrides.unassigned.push({ id, unit });
  }
  saveOverrides(overrides);
  destroyCharts();
  renderSection('sales');
}

function reassignSale(id, unit) {
  const overrides = loadOverrides();
  overrides.unassigned = overrides.unassigned.filter(u => !(u.id === id && u.unit === unit));
  saveOverrides(overrides);
  destroyCharts();
  renderSection('sales');
}

function deleteAddedSale(id) {
  if (!confirm('Excluir esta venda manual?')) return;
  const overrides = loadOverrides();
  overrides.added = overrides.added.filter(s => s.id !== id);
  saveOverrides(overrides);
  destroyCharts();
  renderSection('sales');
}

function openAddSaleModal() {
  const allSales = getFilteredSales();
  const consultants = getConsultants(allSales.filter(s => s.consultant));
  const sel = document.getElementById('add-consultant');
  sel.innerHTML = '<option value="">— Sem consultor —</option>' +
    consultants.map(c => `<option value="${c}">${shortName(c)}</option>`).join('');

  // Populate unit select
  const unitSel = document.getElementById('add-unit');
  unitSel.innerHTML = UNIT_KEYS.map(u => `<option value="${u}">${UNIT_LABELS[u]||u}</option>`).join('');
  if (activeUnit) unitSel.value = activeUnit;

  document.getElementById('add-student').value = '';
  document.getElementById('add-date').value = '';
  document.getElementById('add-contract').value = '';
  document.getElementById('add-type').value = 'new';
  openModal('modal-add-sale');
}

function submitAddSale() {
  const student  = document.getElementById('add-student').value.trim().toUpperCase();
  const consultant = document.getElementById('add-consultant').value;
  const type     = document.getElementById('add-type').value;
  const unit     = document.getElementById('add-unit').value;
  const date     = document.getElementById('add-date').value.trim();
  const contract = document.getElementById('add-contract').value.trim() || '—';

  if (!student || !date || !unit) { alert('Preencha aluno, data e unidade.'); return; }

  const commission = type === 'new' ? 50 : 25;
  const id = 'M' + Date.now();

  const overrides = loadOverrides();
  overrides.added.push({
    id, student, consultant, type, commission, date,
    contract, unit, unit_label: UNIT_LABELS[unit] || unit,
    month: MONTH, _manual: true,
  });
  saveOverrides(overrides);
  closeModal('modal-add-sale');
  destroyCharts();
  renderSection('sales');
}

// ══════════════════════════════════════════════
//  DISPUTE MODAL
// ══════════════════════════════════════════════
function openDisputeModal(saleId, unit) {
  const sales = getFilteredSales();
  const sale = sales.find(s=>s.id===saleId&&s.unit===unit);
  if (!sale) return;
  pendingDisputeSale = {saleId, unit};
  document.getElementById('dispute-sale-info').innerHTML = `
    <strong>Aluno:</strong> ${sale.student} (#${sale.id})<br>
    <strong>Cadastrado por:</strong> ${sale.consultant}<br>
    <strong>Data:</strong> ${sale.date}<br>
    <strong>Contrato:</strong> ${sale.contract}
  `;
  document.getElementById('dispute-reason').value = '';
  openModal('modal-dispute');
}

function submitDispute() {
  const reason = document.getElementById('dispute-reason').value.trim();
  if (!reason) { alert('Informe o motivo da contestação.'); return; }
  const sales = getFilteredSales();
  const sale  = sales.find(s=>s.id===pendingDisputeSale.saleId&&s.unit===pendingDisputeSale.unit);
  if (!sale) return;

  disputes.push({
    saleId: pendingDisputeSale.saleId,
    unit:   pendingDisputeSale.unit,
    unit_label: UNIT_LABELS[pendingDisputeSale.unit] || pendingDisputeSale.unit,
    originalConsultant: sale.consultant,
    claimant: session.name,
    reason,
    status: 'open',
    createdAt: new Date().toLocaleDateString('pt-BR'),
    resolution: null,
    resolvedBy: null,
    resolvedAt: null,
    action: null,
  });
  saveDisputes(disputes);
  closeModal('modal-dispute');
  buildSectionNav();
  renderSection('disputes');
}

// ══════════════════════════════════════════════
//  RESOLVE MODAL
// ══════════════════════════════════════════════
function openResolveModal(idx) {
  pendingResolveIdx = idx;
  const d = disputes[idx];
  document.getElementById('resolve-info').innerHTML = `
    <strong>Venda #${d.saleId}</strong> — ${d.unit_label}<br>
    <strong>Cadastrado por:</strong> ${d.originalConsultant}<br>
    <strong>Contestado por:</strong> ${d.claimant}<br>
    <strong>Motivo:</strong> ${d.reason}
  `;
  document.getElementById('resolve-reason').value = '';
  openModal('modal-resolve');
}

function resolveDispute(action) {
  const res = document.getElementById('resolve-reason').value.trim();
  if (!res) { alert('Informe a justificativa da decisão.'); return; }
  const d = disputes[pendingResolveIdx];
  d.status     = 'resolved';
  d.action     = action;
  d.resolution = res;
  d.resolvedBy = session.name;
  d.resolvedAt = new Date().toLocaleDateString('pt-BR');
  saveDisputes(disputes);
  closeModal('modal-resolve');
  buildSectionNav();
  renderSection('disputes');
}

// ══════════════════════════════════════════════
//  EXPORTAR PLANILHA
// ══════════════════════════════════════════════
function exportSalesCSV() {
  // Pega vendas com todos os overrides aplicados, excluindo sem dono
  const sales = getFilteredSales(null, {includeUnassigned: false});

  // Enriquece com info de disputa resolvida
  const rows = sales.map(s => {
    const dispute = disputes.find(d => d.saleId === s.id && d.unit === s.unit && d.status === 'resolved');
    const origem  = s._manual ? 'Manual' : (dispute ? 'Disputa resolvida' : 'Relatório');
    return {
      'ID':          s.id,
      'Aluno':       s.student,
      'Consultor':   s.consultant,
      'Tipo':        s.type === 'new' ? 'Novo' : 'Rematrícula',
      'Bônus (R$)': s.commission,
      'Data':        s.date,
      'Contrato':    s.contract,
      'Unidade':     s.unit_label,
      'Mês':         s.month,
      'Origem':      origem,
    };
  });

  if (!rows.length) { alert('Nenhuma venda para exportar.'); return; }

  const headers = Object.keys(rows[0]);
  const escape  = v => `"${String(v).replace(/"/g, '""')}"`;
  const csvContent = [
    headers.map(escape).join(';'),
    ...rows.map(r => headers.map(h => escape(r[h])).join(';'))
  ].join('\n');

  // BOM para Excel abrir UTF-8 corretamente
  const blob = new Blob(['﻿' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const unit = activeUnit ? UNIT_LABELS[activeUnit].replace(/\s+/g,'_') : 'Todas_Unidades';
  a.href     = url;
  a.download = `Bonus_${MONTH.replace('/','_')}_${unit}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

//  MODAL HELPERS
// ══════════════════════════════════════════════
function openModal(id)  { document.getElementById(id).classList.add('open') }
function closeModal(id) { document.getElementById(id).classList.remove('open') }
document.querySelectorAll('.modal-overlay').forEach(m =>
  m.addEventListener('click', e => { if(e.target===m) m.classList.remove('open'); })
);

// ══════════════════════════════════════════════
//  CHART CLEANUP
// ══════════════════════════════════════════════
function destroyCharts() {
  if (chartRanking)  { chartRanking.destroy();  chartRanking=null; }
  if (chartCompare)  { chartCompare.destroy();  chartCompare=null; }
  if (chartTimeline) { chartTimeline.destroy(); chartTimeline=null; }
  if (chartCmp1)     { chartCmp1.destroy();     chartCmp1=null; }
  if (chartCmp2)     { chartCmp2.destroy();     chartCmp2=null; }
}

(function init() {
  const saved = localStorage.getItem(SESSION_KEY);
  if (saved) {
    session = JSON.parse(saved);
    bootApp();
  }
})();
